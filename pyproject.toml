[project]
name = "spiderhub"
version = "0.1.0"
description = "Python crawler hub for multi-spider orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.10",
  "selectolax>=0.3",
  "PyMySQL>=1.1",
  "python-dotenv>=1.0",
  "curl_cffi>=0.10",
  "playwright>=1.50",
]

[project.scripts]
spiderhub = "spiderhub.cli:main"

[project.optional-dependencies]
stealth = [
  "camoufox>=0.4",
  "patchright>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "ruff>=0.11",
  "mypy>=2,<3",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "types-PyMySQL",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spiderhub"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["spiderhub"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
  "camoufox",
  "camoufox.*",
  "patchright",
  "patchright.*",
  "numpy",
  "numpy.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
