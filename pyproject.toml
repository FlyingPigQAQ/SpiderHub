[project]
name = "spiderhub"
version = "0.1.0"
description = "Python crawler hub for multi-spider orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
spiderhub = "spiderhub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "ruff>=0.11",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spiderhub"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["spiderhub"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
